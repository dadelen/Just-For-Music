name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build arm64 macOS release
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must look like v1.2.3" >&2
            exit 1
          fi

      - name: Select an SDK supporting native glass and translation strategies
        shell: bash
        run: |
          python3 - <<'PYSDK'
          import glob, os, subprocess
          candidates = []
          for app in glob.glob('/Applications/Xcode*.app'):
              developer = app + '/Contents/Developer'
              env = dict(os.environ, DEVELOPER_DIR=developer)
              result = subprocess.run(['xcrun', '--sdk', 'macosx', '--show-sdk-version'], env=env, capture_output=True, text=True)
              if result.returncode == 0:
                  version = tuple(int(part) for part in result.stdout.strip().split('.'))
                  if version >= (26, 4):
                      candidates.append((version, developer))
          if not candidates:
              raise SystemExit('This runner needs Xcode with macOS SDK 26.4 or newer.')
          developer = max(candidates)[1]
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('DEVELOPER_DIR=' + developer + '\n')
          print('Selected', developer)
          PYSDK

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Build release artifacts
        env:
          VERSION: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
          BUNDLE_IDENTIFIER: ${{ vars.BUNDLE_IDENTIFIER }}
          UPDATE_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          VERSION="${VERSION#v}" ./scripts/create-release-artifacts.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/release/* \
            --verify-tag \
            --title "Just-For-Music ${GITHUB_REF_NAME#v}" \
            --generate-notes
